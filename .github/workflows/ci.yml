name: CI

on:
  - pull_request

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Linting
        run: pnpm lint

      - name: Check Typescript
        run: pnpm typecheck

      - name: Test MCP and shared bridge behavior
        run: pnpm test

      - name: Check spelling
        run: pnpm run spellcheck

      - name: Build Cloudflare Worker
        run: pnpm build:cloudflare
        env:
          INFURA_ID: "unsafe_test_id"
          WALLETCONNECT_PID: "unsafe_test_pid"

      - name: Validate staging and production bundles
        run: |
          pnpm exec wrangler deploy --env "" --dry-run
          pnpm exec wrangler deploy --env prod --dry-run

      - name: Smoke test the Workers runtime
        run: |
          pnpm preview:cloudflare --port 8787 > /tmp/worker-preview.log 2>&1 &
          preview_pid=$!
          trap 'cat /tmp/worker-preview.log; kill "$preview_pid" 2>/dev/null || true' EXIT
          node --test tests/cloudflare-smoke.test.mjs
